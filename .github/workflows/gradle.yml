name: Java CI with Gradle

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: 'Build'
    steps:
      - uses: actions/checkout@v7

      # Keyed on buildtools.sh, which holds the BuildTools revisions, so editing this workflow keeps the same cache.
      # When the list changes, the previous cache is still restored through the prefix and only the missing revisions
      # are built.
      - name: Restore Spigot jars
        id: cache-spigot
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/spigotmc
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-spigot-${{ hashFiles('.github/buildtools.sh') }}
          restore-keys: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-spigot-

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
            21
            25

      - name: Run BuildTools
        run: bash .github/buildtools.sh

      # Saved right after BuildTools, so a failing Gradle build does not throw the jars away
      - name: Save Spigot jars
        if: steps.cache-spigot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/spigotmc
          key: ${{ steps.cache-spigot.outputs.cache-primary-key }}

      # Caches the Gradle home, including the build cache, so unchanged NMS modules are not compiled and remapped again
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build with Gradle
        run: ./gradlew build --build-cache --parallel -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      # Picked up by release.yml, so the release does not run BuildTools and Gradle again
      - name: Upload release jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: core/build/libs/InventoryFramework-*[0-9].jar
          if-no-files-found: error
          retention-days: 7

      # Publishes me.croabeast.inventory:framework to https://croabeast.github.io/repo/. Done here and not in
      # release.yml because the build outputs are still around; Gradle keeps every version in maven-metadata.xml.
      - name: Checkout Maven repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          repository: CroaBeast/repo
          path: maven-repo
          token: ${{ secrets.MAVEN_DEPLOY_TOKEN }}

      - name: Deploy to Maven repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew :core:publishMavenPublicationToCroaBeastRepository --build-cache \
            -PdeployRepo=maven-repo -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

          VERSION=$(./gradlew -q :core:properties | awk -F': ' '/^version:/ {print $2; exit}')

          cd maven-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add me/croabeast/inventory
          git commit -m "Deploy InventoryFramework $VERSION" || echo "No changes to commit"
          git push
