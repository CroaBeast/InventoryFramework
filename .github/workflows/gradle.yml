name: Java CI with Gradle

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: 'Build'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Spigot jars
        id: cache-spigot
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-spigot-${{ hashFiles('build.gradle.kts') }}

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17
            21
            25

      - name: Run BuildTools
        if: steps.cache-spigot.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildtools && cd buildtools
          wget -q https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

          for rev in 1.14.4 1.15.2 1.16.1 1.16.3 1.16.5; do
            "$JAVA_HOME_11_X64/bin/java" -jar BuildTools.jar --rev $rev
          done
          # --rev 1.20, 1.20.5 and 1.21 resolve to 1.20.1, 1.20.6 and 1.21.1; these build numbers pin the original
          # releases (3798 = 1.20, 4132 = 1.20.5, 4289 = 1.21)
          for rev in 1.17.1 1.18.2 1.19.4 3798 1.20.1 1.20.2 1.20.4; do
            "$JAVA_HOME_17_X64/bin/java" -jar BuildTools.jar --rev $rev --remapped
          done
          for rev in 4132 1.20.6 4289 1.21.1 1.21.3 1.21.4 1.21.5 1.21.8 1.21.10 1.21.11; do
            "$JAVA_HOME_21_X64/bin/java" -jar BuildTools.jar --rev $rev --remapped
          done
          "$JAVA_HOME_25_X64/bin/java" -jar BuildTools.jar --rev 26.1.2

      - name: Build with Gradle
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
